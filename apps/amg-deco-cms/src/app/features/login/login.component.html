<main class="login-page" role="main">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-amg">AMG</span>
      <span class="logo-deco">Décoration d'Intérieur</span>
      <span class="logo-admin">Administration</span>
    </div>

    @if (state() === 'error') {
      <div class="alert alert-error" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.error]="emailCtrl.invalid && emailCtrl.touched"
          aria-required="true"
          [attr.aria-describedby]="emailCtrl.invalid && emailCtrl.touched ? 'email-error' : null"
        />
        @if (emailCtrl.invalid && emailCtrl.touched) {
          <span class="error-msg" id="email-error" role="alert"> Adresse email invalide </span>
        }
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [class.error]="passwordCtrl.invalid && passwordCtrl.touched"
          aria-required="true"
          [attr.aria-describedby]="passwordCtrl.invalid && passwordCtrl.touched ? 'password-error' : null"
        />
        @if (passwordCtrl.invalid && passwordCtrl.touched) {
          <span class="error-msg" id="password-error" role="alert"> Mot de passe requis (6 caractères minimum) </span>
        }
      </div>

      <button
        type="submit"
        class="btn btn-gold submit-btn"
        [disabled]="state() === 'loading'"
        [attr.aria-busy]="state() === 'loading'"
      >
        {{ state() === 'loading' ? 'Connexion en cours…' : 'Se connecter' }}
      </button>
    </form>
  </div>
</main>
