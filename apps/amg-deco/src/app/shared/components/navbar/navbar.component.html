<nav
  role="navigation"
  aria-label="Navigation principale"
  [ngClass]="{
    'navbar--scrolled': isScrolled(),
    'navbar--menu-open': isMenuOpen(),
  }"
  class="navbar"
  (keydown)="onKeydown($event)"
>
  <div class="container-amg navbar__inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar__logo" aria-label="AMG Décoration d'Intérieur — Retour à l'accueil">
      <img
        ngSrc="/assets/images/logo/logo-color.webp"
        alt="AMG Décoration d'Intérieur"
        width="56"
        height="56"
        class="navbar__logo-img"
        priority=""
      />
    </a>

    <!-- Navigation desktop -->
    <ul class="navbar__links" role="list">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="navbar__link--active"
            #rlDesktop="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            [attr.aria-current]="rlDesktop.isActive ? 'page' : null"
            class="navbar__link"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- CTA Desktop -->
    <a routerLink="/contact" class="btn-primary navbar__cta-desktop"> Prendre rendez-vous </a>

    <!-- Burger Button -->
    <button
      type="button"
      class="navbar__burger"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuAriaLabel()"
      (click)="toggleMenu()"
    >
      <span class="navbar__burger-line" [ngClass]="{ 'navbar__burger-line--open-top': isMenuOpen() }"></span>
      <span class="navbar__burger-line" [ngClass]="{ 'navbar__burger-line--open-mid': isMenuOpen() }"></span>
      <span class="navbar__burger-line" [ngClass]="{ 'navbar__burger-line--open-bottom': isMenuOpen() }"></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div
    id="mobile-menu"
    class="navbar__mobile-menu"
    [ngClass]="{ 'navbar__mobile-menu--open': isMenuOpen() }"
    role="region"
    aria-label="Menu mobile"
  >
    <ul class="navbar__mobile-links" role="list">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="navbar__mobile-link--active"
            #rlMobile="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            [attr.aria-current]="rlMobile.isActive ? 'page' : null"
            class="navbar__mobile-link"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        </li>
      }
      <li>
        <a routerLink="/contact" class="btn-primary navbar__mobile-cta" (click)="closeMenu()"> Prendre rendez-vous </a>
      </li>
    </ul>
  </div>
</nav>
